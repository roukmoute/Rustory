[package]
name = "rustory"
version = "0.11.0"
description = "Rustory — local-first desktop companion for Lunii and other supported devices"
authors = ["Rustory contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.0"
# Added 2026-07-16 for the OS-open channel: relays a second launch's
# (argv, cwd) to the living instance (Windows/Linux hand "open with
# Rustory" gestures to a NEW process) and enforces the one-process-per-
# app_data_dir invariant the recovery journals assume. Deliberately
# WITHOUT the `deep-link` feature (URL schemes only — file associations
# do not go through it), no npm companion package, no new capability
# (the plugin exposes no JS API). Desktop-only; Linux rides the D-Bus
# stack (zbus already in the tree), Windows rides windows-sys (already
# present).
tauri-plugin-single-instance = "2"
# Official Tauri updater for the user-triggered update gesture (`Update
# Apply Contract`). Rust-side ONLY: no npm companion, no capability (the
# renderer never invokes the plugin — everything rides our commands).
# `default-features = false` is MANDATORY: the plugin defaults to
# `rustls-tls`, and the CI TLS constraint (system OpenSSL via native-tls,
# no cmake — see the reqwest block below) applies to it like to every
# networked dep. `zip` stays on: it carries the updater-archive
# extraction, pure Rust. The plugin brings its own async reqwest 0.13,
# which COEXISTS with the product's pinned blocking 0.12 (two distinct
# majors) — the lock cortege is expected and bounded to this plugin.
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["native-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Added 2026-07-22 for the structured-archive (.zip pack) reader — the
# capability the support matrix carried as deferred under the
# zero-dependency rule, activated by explicit product decision (the
# community pack format users actually hold is a zip archive). Pure
# Rust, ALREADY COMPILED in this workspace (the updater plugin pulls the
# same crate): adding it costs no new download and no new toolchain
# constraint. `deflate` only — stored/deflated entries cover the format.
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
rusqlite = { version = "=0.32", features = ["bundled"] }
uuid = { version = "=1.11", features = ["v7"] }
sha2 = "=0.10"
# Lunii V3 pack ciphering (device write/read, story 3.x). V3 ciphers the first
# 512 bytes of content files with AES-128-CBC (key/IV read from the device
# `.md` at 0x40/0x50, each per-4-byte-word endianness-swapped). Pure-Rust
# RustCrypto crates — NO C toolchain / cmake, so they respect the CI build
# constraint (unlike aws-lc). `aes` is the block cipher, `cbc` the mode;
# `cipher` exposes the block-padding traits (NoPadding — we cipher an exact
# 16-byte-aligned region, never PKCS padding). Validated against a real device.
aes = "=0.8.4"
cbc = "=0.1.2"
cipher = { version = "=0.4.4", features = ["block-padding"] }
time = { version = "=0.3", features = ["formatting", "parsing", "macros", "serde"] }
unicode-normalization = "=0.1"
tempfile = "=3.27.0"
scraper = "=0.22"
# Cross-platform USB Mass Storage volume enumeration for the Lunii
# detection scan (story 2-1). Maintained by sysinfo-rs/sysinfo, widely
# deployed, no GUI/runtime dep, no transitive C deps beyond OS APIs.
sysinfo = "=0.32"
# Blocking HTTP client for the EXPLICIT official-catalog fetch (story 2-6,
# Phase C). `native-tls` links the system OpenSSL (CI installs libssl-dev;
# no cmake needed, unlike the rustls/aws-lc backend). The fetch only ever
# runs on a deliberate user action (offline-first guardrail) and is driven
# on a `spawn_blocking` worker behind the `OfficialCatalogSource` trait.
reqwest = { version = "=0.12.9", default-features = false, features = ["blocking", "native-tls"] }
# Event-driven XML reader for the bounded RSS 2.0 ingestion parse. Pure
# Rust, zero cmake (CI TLS constraint), no external-entity resolution and
# no DTD expansion by construction (no XXE, no entity bombs); the domain
# parser adds its own depth/count/length bounds. `feed-rs` was refused
# (chrono/mime/regex transitives, a second time stack next to `time`, a
# model oversized for the minimal RSS 2.0 scope).
quick-xml = "=0.40.1"
# Added 2026-07-23 for node-media image processing: decode PNG/JPEG/BMP/WebP and
# re-encode a resized (≤320×240, the Lunii display) PNG so an added photo is
# not stored raw (10 MB), and community-pack BMP images become usable PNGs.
# Explicit product requirement (image resizing). PURE RUST codecs only
# (`default-features = false` avoids native codecs; `image-webp` is pure Rust)
# — no cmake, no system lib, honoring the CI build constraint. Pinned strict.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
# Added 2026-09-05 for the device send of LIBRARY stories (created from a
# web page, an RSS feed or the editor — no retained `.zip`): their audio
# (m4a/AAC, stereo or 48 kHz MP3, wav, ogg) must become the ONLY format a
# Lunii plays — a bare MPEG-1 Layer III, 44100 Hz, MONO MP3. Symphonia
# DECODES those inputs and `rusty_mp3` ENCODES the device MP3; the
# 48 → 44.1 kHz resampler is ours (infrastructure/device/resample.rs).
# PURE RUST both — no cmake, no system lib (CI build constraint) and no
# LGPL (`shine-rs` was refused: LGPL-2.0 statically linked). Symphonia is
# MPL-2.0 (file-level copyleft, used unmodified), `default-features =
# false` plus EXACTLY the codec/container set the media store admits (the
# `assets.media_format` CHECK: mp3, wav, ogg, m4a) and the ID3v2 reader
# (tagged podcast MP3s); no SIMD feature (a 16-minute AAC episode already
# decodes in ~1 s). `rusty_mp3` is Apache-2.0 with ZERO dependencies; it
# reads a few `MP3_*` tuning env vars at runtime (never set by Rustory —
# the defaults apply). Both pinned strict.
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "id3v2", "pcm", "wav", "ogg", "vorbis"] }
rusty_mp3 = "=0.7.0"
# Added 2026-09-05 to INSTALL the downloadable embedded voice (the Piper
# text-to-speech runtime ships as a tar.gz on Linux/macOS and a zip on
# Windows; the zip crate above already covers the latter). Both crates are
# ALREADY COMPILED in this workspace (the updater plugin pulls them):
# no new download, no new toolchain constraint, pure Rust (`flate2`
# defaults to the miniz_oxide backend). Pinned strict.
flate2 = "=1.1.9"
tar = "=0.4.46"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows speech runtime (WinRT `Windows.Media.SpeechSynthesis`) for the
# SYSTEM voices — the voices already installed on the machine, listed and
# used to speak the story announcements. The `windows` crate is already
# in the tree at this exact version (Tauri's Windows stack); only the
# speech + streams + WinRT-init features are added (`Media_Core` gates the
# text-to-stream call). Pure Rust bindings, no C toolchain. Pinned strict.
windows = { version = "=0.61.3", features = ["Foundation", "Foundation_Collections", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-only D-Bus binding used to talk to udisks2 and auto-mount a
# plugged Lunii whose volume the desktop session did not auto-mount
# (common with minimal DEs / lockdown polkit rules). Pinned strict.
# `blocking-api` keeps the integration synchronous so it slots into
# the existing scanner without forcing tokio onto the workspace.
# `async-io` is zbus's own mandatory transport backend (its default);
# it was previously activated by feature unification through
# tauri-plugin-opener's transitive zbus — the opener removal makes the
# activation explicit, adding no crate that was not already in the tree.
zbus = { version = "=5.16", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
# Acceptance fixtures (S2/S3): the local fixture pages must serve REAL
# png/jpeg bytes — the node-media store decodes and re-encodes every
# image before storing it, so magic-only fakes would be refused. Same
# pinned pure-Rust crate as the production dependency: test-only, zero
# production code change.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# Dependencies are OPTIMIZED even in the dev profile: the audio codecs the
# device send relies on (Symphonia decode, rusty_mp3 encode) run ~20× slower
# unoptimized — a 16-minute podcast episode took 157 s to transcode in a
# plain dev build against 8 s in release, which made `tauri dev` unusable
# for that flow. Only third-party crates are affected (one longer first
# build, then cached); the crate itself keeps its fast incremental debug
# builds. Tests and `tauri dev` inherit this; release is untouched.
[profile.dev.package."*"]
opt-level = 3
# …and the crate itself gets light optimization: its own resampler
# (2.8 G multiply-adds per episode) took 45 s unoptimized against ~1 s at
# `opt-level = 1`, which keeps debug info and near-debug compile times.
[profile.dev]
opt-level = 1
